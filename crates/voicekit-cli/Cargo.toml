[package]
name = "voicekit-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voicekit"
path = "src/main.rs"

[dependencies]
voicekit-core = { path = "../voicekit-core" }

clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54", features = ["full"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1+spec-1.1.0"
colored = "3.1.1"
