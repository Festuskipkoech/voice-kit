# root config

[server]
host = "0.0.0.0"
port = 8080
max_connections = 100

[vad]
model_path = "models/silero/silero_vad.onnx"
threshold = 0.5
silence_ms = 800
chunk_samples = 512

[stt]
provider = "moonshine"
model_path = "models/moonshine/tiny"

[llm]
provider = "llamacpp"
model_path = "models/llm/gemma-3-1b-it-Q4_K_M.gguf"
system_prompt = "You are a helpful voice assistant. Respond in plain spoken English only. No markdown, no bullet points, no emoji. Keep answers short and conversational."
context_size = 2048

[tts]
provider = "paradee"
model_path = "models/paradee"
voice = "af_heart"
sample_rate = 24000

# Model registry — used by scripts/download_models.py
# All models are hosted at techy21/voicekit-models on HuggingFace.
# SHA256 checksums verified on 2026-11-14.

[models.moonshine-tiny]
repo = "techy21/voicekit-models"
path = "moonshine/tiny"
files = [
    "onnx/encoder_model_quantized.onnx",
    "onnx/decoder_model_merged_quantized.onnx",
    "tokenizer.json",
    "tokenizer_config.json",
]

