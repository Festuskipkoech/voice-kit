services:

  # Writes ./voicekit-data/config.toml from the baked-in template on first run.
  # On subsequent runs validates the existing config and exits.
  config-init:
    image: ghcr.io/festuskipkoech/voicekit:latest
    user: root
    entrypoint: ["sh", "/etc/voicekit/init_config.sh"]
    volumes:
      - ./voicekit-data:/data
    restart: "no"

  # Downloads and verifies model weights into ./models.
  # Skips files that are already present and checksums match.
  model-init:
    image: ghcr.io/festuskipkoech/voicekit:latest
    user: root
    entrypoint:
      - python3
      - -I
      - /etc/voicekit/download_models.py
      - --config
      - /data/config.toml
      - --dest
      - /models
    volumes:
      - ./models:/models
      - ./voicekit-data:/data:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    restart: "no"

  voicekit-server:
    image: ghcr.io/festuskipkoech/voicekit:latest
    ports:
      - "${VOICEKIT_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
      - ./voicekit-data/config.toml:/data/config.toml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-voicekit=info}"
    depends_on:
      config-init:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s