<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicekit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <header class="header">
            <div class="logo">
                <div class="logo-mark">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg>
                </div>
                <span>Voicekit</span>
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </header>

        <main class="main">
            <div class="mic-wrap" id="mic-wrap">
                <canvas id="canvas" width="280" height="280"></canvas>
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <button class="mic-btn" id="mic-btn" disabled>
                    <svg id="mic-icon" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg>
                    <svg id="stop-icon" class="hidden" width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="2.5" />
                    </svg>
                    <div id="spinner" class="spinner hidden"></div>
                    <svg id="wave-icon" class="hidden" width="38" height="38" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <path d="M2 12h2M6 8v8M10 5v14M14 8v8M18 6v12M22 12h-2" />
                    </svg>
                </button>
            </div>

            <div class="state-label" id="state-label">Connecting...</div>
        </main>

        <section class="transcript-section">
            <div class="transcript-header">
                <span>Conversation</span>
                <button class="clear-btn" id="clear-btn">Clear</button>
            </div>
            <div class="transcript" id="transcript">
                <p class="transcript-empty">Transcript will appear here</p>
            </div>
        </section>

        <footer class="footer">
            <div class="server-row">
                <span class="server-label">Server</span>
                <input class="server-input" id="server-input" value="ws://localhost:8080" spellcheck="false"
                    autocomplete="off" />
                <button class="connect-btn" id="connect-btn">Connect</button>
            </div>
        </footer>

    </div>
    <script src="app.js"></script>
</body>

</html>
